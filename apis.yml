aid: topxgun
name: TopXGun
description: 'TopXGun (Nanjing TopXGun Robotics / 拓攻机器人) is a Chinese unmanned aerial
  vehicle manufacturer specializing in the research, development, and production of
  agricultural spray drones, heavy-lift delivery drones, industrial and cleaning drones,
  firefighting and emergency UAVs, tethered drones, eVTOL and large unmanned aircraft,
  and the professional flight-control and avionics hardware, payload equipment, and
  software systems that power them. Its whole-aircraft capability spans all airspace
  below 5,000 meters and payloads up to 1.5 tons across core industries, and it offers
  ODM/OEM customization and education support. Its overseas agricultural line is marketed
  as TopXGun Agriculture (topxgunag.com) with CE, FCC, RoHS, and KC certifications.
  Surfaced as a portfolio company of DCM Ventures. No public web API, SDK, or developer
  portal was found during enrichment; this is a hardware manufacturer.'
